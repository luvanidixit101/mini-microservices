spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Route 1: /api/students -> STUDENT-SERVICE
spring.cloud.gateway.routes[0].id=students
spring.cloud.gateway.routes[0].uri=lb://STUDENT-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/students, /api/students/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# Route 2: /api/courses -> COURSE-SERVICE
spring.cloud.gateway.routes[1].id=courses
spring.cloud.gateway.routes[1].uri=lb://COURSE-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/courses, /api/courses/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1